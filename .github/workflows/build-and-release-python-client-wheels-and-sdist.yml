name: Build and Release Python Client Wheels and Sdist

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

permissions:
  contents: read
  # Required by PyPI for trusted publishing (if using OIDC)
  id-token: write
  attestations: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        target:
          # Note: We now specify the exact Rust target triple for Zig
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '33.1'

      # We don't need QEMU to *build* with Zig, but we do need it to *test* the aarch64 wheel later
      - name: Setup QEMU
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3

      - name: Install Zig Toolchain
        run: |
          pip install ziglang cargo-zigbuild
          # Since we aren't using pipx here (global pip in GHA), we can just symlink directly
          # in the global Python bin directory
          ln -s $(dirname $(which python-zig))/python-zig $(dirname $(which python-zig))/zig

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # The --zig flag tells Maturin to use cargo-zigbuild internally
          # We explicitly disable the manylinux container so it runs natively on the runner
          args: --release --out dist --manifest-path umadb-python/Cargo.toml -i python${{ matrix.python-version }} --zig --manylinux 2_34
          container: off

      - name: Start UmaDB server
        run: |
          docker network create umadb-net
          docker run -d --network umadb-net --name umadb-server umadb/umadb:latest
          # Wait for server to become ready
          for i in {1..20}; do
              if nc -z localhost 50051; then
                  echo "UmaDB server is up!"
                  break
              fi
              echo "Waiting for UmaDB server..."
              sleep 1
          done

      - name: Test built wheel
        uses: addnab/docker-run-action@v3
        with:
          # We still use the manylinux container here just for a clean testing environment
          image: quay.io/pypa/manylinux_2_34_${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64' || 'x86_64' }}
          options: |
            -v ${{ github.workspace }}/dist:/dist
            --platform ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'linux/arm64' || 'linux/amd64' }}
            --network umadb-net
          run: |
            /opt/python/cp310-cp310/bin/pip install /dist/*.whl
            /opt/python/cp310-cp310/bin/python - << 'END'
            from umadb import Client, Event

            client = Client("http://umadb-server:50051")
            
            event = Event(
                event_type="UserCreated",
                data=b"user data",
                tags=["user", "creation"],
            )
            position = client.append([event])
            print(f"Event appended at position: {position}")
            
            events = client.read()
            for seq_event in events:
                print(f"Position {seq_event.position}: {seq_event.event.event_type}")
            END

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path umadb-python/Cargo.toml

      - name: Test built wheel
        run: |
          pip install umadb --no-index --find-links dist --force-reinstall
          python -c "import umadb"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.python-version }}-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        platform:
          - runner: macos-latest
            target: aarch64
          - runner: macos-15-intel
            target: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path umadb-python/Cargo.toml
      #          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Test built wheel
        run: |
          pip install umadb --no-index --find-links dist --force-reinstall
          python -c "import umadb"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.python-version }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path umadb-python/Cargo.toml

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    environment: pypi

#    needs: [linux, musllinux, windows, macos, sdist]
    needs: [linux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
