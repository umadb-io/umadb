name: Build and Release Server Binaries and Docker Images

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  REGISTRY_IMAGE_GHCR: ghcr.io/${{ github.repository_owner }}/umadb
  REGISTRY_IMAGE_DH: umadb/umadb

jobs:
  build-binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU targets (Linked against glibc 2.34 via zigbuild for AL2023 compatibility)
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            cpu_level: x86-64-v2
            artifact_name: umadb-x86_64-unknown-linux-gnu-v2
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            cpu_level: x86-64-v3
            artifact_name: umadb-x86_64-unknown-linux-gnu-v3

          # --- Other Targets ---
          - os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            cpu_level: generic
            artifact_name: umadb-aarch64-unknown-linux-gnu
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            cpu_level: generic
            artifact_name: umadb-x86_64-apple-darwin
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            cpu_level: generic
            artifact_name: umadb-aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary
        run: make build-zig-umadb-${{ matrix.rust_target }} CPU_LEVEL=${{ matrix.cpu_level }}

      - name: Compress binary
        run: |
          cd target/${{ matrix.rust_target }}/release
          tar czf ../../../${{ matrix.artifact_name }}.tar.gz umadb

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: ignore

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Create Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/**/*.tar.gz

  docker:
    name: Create Docker Images
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Prepare binaries for Docker
        run: |
          mkdir -p ./binaries/linux/amd64
          mkdir -p ./binaries/linux/arm64
          
          # Extract Linux x86_64 GNU binary - use v2 for maximum Docker host compatibility
          tar xzf artifacts/umadb-x86_64-unknown-linux-gnu-v2/umadb-x86_64-unknown-linux-gnu-v2.tar.gz -C ./binaries/linux/amd64
          chmod +x ./binaries/linux/amd64/umadb

          # Extract Linux aarch64 GNU binary
          tar xzf artifacts/umadb-aarch64-unknown-linux-gnu/umadb-aarch64-unknown-linux-gnu.tar.gz -C ./binaries/linux/arm64
          chmod +x ./binaries/linux/arm64/umadb
                    
          # List binaries
          ls -lh ./binaries/linux/amd64
          ls -lh ./binaries/linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE_GHCR }},${{ env.REGISTRY_IMAGE_DH }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true