name: Rust Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set temporary directory for entire job
      # Redirects Rust's tempdir() to the large root disk
      run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        version: '33.1'
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install UV
      run: make install-uv
    - name: Install Python tools
      run: make install-python-tools
    - name: Build
      run: make build
    - name: Tests
      run: make test
    - name: Tests - with page cache
      run: UMADB_PAGE_CACHE_MAX_MB=1000 make test
    - name: Tests - pipelined
      run: UMADB_PIPELINED_WRITER=true make test
    - name: Tests - pipelined with page cache
      run: UMADB_PIPELINED_WRITER=true UMADB_PAGE_CACHE_MAX_MB=1000 make test
    - name: Compare actual vs approx memory per page
      run: make test-compare-actual-vs-approx-memory-per-page
    - name: Profile page weigher
      run: make bench-page-approx-deserialized-bytes

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        version: '33.1'
    - name: Build server
      run: cargo build --bin umadb --release
    - name: Test workspace
      run: cargo test --workspace --exclude umadb-python --exclude umadb-benches --exclude umadb-tools
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.11.7"
    - name: Build and test Python package
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
      run: |
        uv sync
        cargo run --bin stub_gen --no-default-features
        uv run mypy --strict --platform win32 ./umadb-python
        uv run maturin develop --uv -m umadb-python/Cargo.toml
        uv run python -m unittest discover -v ./umadb-python/tests
        uv run python -m pytest -v ./umadb-python/examples/pytest_fixtures.py